name: Stale Issues
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/stale@v10
        with:
          stale-issue-label: stale
          stale-pr-label: stale
          days-before-stale: 56 # Mark stale after 8 weeks (56 days) of inactivity
          days-before-close: -1 # Disable auto-closing
          days-before-pr-stale: -1 # PRs are handled by close-prs
          remove-pr-stale-when-updated: false # Leave existing PR labels untouched
          exempt-all-milestones: true # Any issue/PR within a milestone will be omitted

  close-prs:
    runs-on: ubuntu-latest
    needs: stale
    if: ${{ !cancelled() }}
    permissions:
      checks: read
      pull-requests: write

    steps:
      - name: Close PRs with uncorrected sign-offs or no recent activity
        uses: actions/github-script@v8
        with:
          script: |
            const repo = context.repo;

            // How long each situation is tolerated before the PR is closed.
            const DAY = 24 * 60 * 60 * 1000;
            const SIGNOFF_DAYS = 7;   // Failed Sign-offs check not corrected
            const DRAFT_DAYS = 14;    // Draft PRs with no activity
            const INACTIVE_DAYS = 90; // Non-draft PRs with no activity

            const REOPEN = 'Please comment here if you would like the team to re-open this PR so that you can continue with it.';
            const MESSAGES = {
              signoffs: `This PR has been automatically closed as missing sign-offs have not been corrected in the last ${SIGNOFF_DAYS} days. Please review the \`CONTRIBUTING.md\` guide for more information. ${REOPEN}`,
              draft: `This PR has been automatically closed as it has remained in draft with no activity for the last ${DRAFT_DAYS} days. ${REOPEN}`,
              inactive: `This PR has been automatically closed as it has had no activity for the last ${INACTIVE_DAYS} days. ${REOPEN}`,
            };

            // Whether the latest Sign-offs check run failed longer ago than SIGNOFF_DAYS.
            const expiredSignoffs = async (sha) => {
              const checks = await github.paginate(github.rest.checks.listForRef, {
                ...repo,
                ref: sha,
                check_name: 'Sign-offs',
                filter: 'all',
                per_page: 100,
              });
              // Include pending runs so a rerun cannot leave an old failure eligible.
              const latest = checks
                .filter(check => check.app?.slug === 'github-actions')
                .sort((a, b) => b.id - a.id)[0];
              return latest?.status === 'completed' && latest.conclusion === 'failure' &&
                     Date.parse(latest.completed_at) <= Date.now() - SIGNOFF_DAYS * DAY;
            };

            const inactiveFor = (pull, days) => Date.parse(pull.updated_at) <= Date.now() - days * DAY;

            // The MESSAGES key explaining why the PR should close, or undefined to keep it.
            const shouldClose = async (pull) => {
              if (await expiredSignoffs(pull.head.sha)) return 'signoffs';
              if (pull.draft) return inactiveFor(pull, DRAFT_DAYS) ? 'draft' : undefined;
              return inactiveFor(pull, INACTIVE_DAYS) ? 'inactive' : undefined;
            };

            for (const pull of await github.paginate(github.rest.pulls.list, {
              ...repo,
              state: 'open',
              per_page: 100,
            })) {
              try {
                const reason = await shouldClose(pull);
                if (!reason) continue;

                // Recheck before closing in case commits or check results changed.
                const pr = { ...repo, pull_number: pull.number };
                const { data: current } = await github.rest.pulls.get(pr);
                if (current.state !== 'open' || current.head.sha !== pull.head.sha ||
                    await shouldClose(current) !== reason) continue;

                // Close before commenting so a failed comment cannot repeat daily.
                await github.rest.pulls.update({ ...pr, state: 'closed' });
                await github.rest.issues.createComment({
                  ...repo,
                  issue_number: pull.number,
                  body: MESSAGES[reason],
                });
                core.info(`Closed PR #${pull.number}: ${reason}.`);
              } catch (err) {
                core.warning(`Skipping PR #${pull.number}: ${err.message}`);
              }
            }
