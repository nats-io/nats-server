name: Docker Nightly
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Override source branch (optional)"
        type: string
        required: false

  schedule:
    - cron: "40 4 * * *"

permissions:
  contents: read

jobs:
  run:
    runs-on: ${{ vars.GHA_WORKER_RELEASE || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      - name: Checkout NATS
        uses: actions/checkout@v7.0.1
        with:
          path: src/github.com/nats-io/nats-server
          ref: ${{ inputs.target || 'main' }}
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout NSC
        uses: actions/checkout@v7.0.1
        with:
          repository: nats-io/nsc
          path: src/github.com/nats-io/nsc
          fetch-depth: 1
          fetch-tags: true

      - name: Checkout NATS CLI
        uses: actions/checkout@v7.0.1
        with:
          repository: nats-io/natscli
          path: src/github.com/nats-io/natscli
          fetch-depth: 1
          fetch-tags: true

      - name: Log in to Docker Hub
        shell: bash
        run: docker login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKER_PASSWORD }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Generate build metadata
        shell: sh
        run: |
          echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
          echo "GIT_COMMIT=$(git -C "${{ github.workspace }}/src/github.com/nats-io/nats-server" rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "BUILD_NAME=$(echo ${{ inputs.target || 'nightly' }} | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9.-]/-/g')" >> $GITHUB_ENV

      - name: Build and push Docker images
        uses: docker/build-push-action@v6.19.2
        with:
          context: "${{ github.workspace }}/src/github.com/nats-io"
          file: "${{ github.workspace }}/src/github.com/nats-io/nats-server/docker/Dockerfile.nightly"
          build-args: |
            VERSION=nightly-${{ env.BUILD_DATE }}
            GIT_COMMIT=${{ env.GIT_COMMIT }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            synadia/nats-server:${{ env.BUILD_NAME }}
            synadia/nats-server:${{ env.BUILD_NAME }}-${{ env.BUILD_DATE }}
